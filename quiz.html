<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>German Unification | Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}

body{
    background: linear-gradient(to bottom,#ffffff 0%,#f5b5b5 30%,#cc0000 60%,#330000 85%,#000000 100%);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:white;
    width:92%;
    max-width:1000px;
    min-height:500px;
    padding:60px 50px;
    border-radius:25px;
    box-shadow:0 30px 70px rgba(0,0,0,0.45);
    text-align:center;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.progress-bar{width:100%;height:14px;background:#eee;border-radius:20px;margin-bottom:25px;overflow:hidden;}
.progress{height:100%;width:0%;background:linear-gradient(90deg,#000,#dd0000,#ffce00);transition:width 0.4s ease;}

.question{font-size:24px;margin-bottom:30px;font-weight:600;}
.option{
    padding:18px;
    border-radius:14px;
    border:1px solid #ccc;
    margin-bottom:16px;
    cursor:pointer;
    transition:0.25s;
    font-size:18px;
}
.option:hover{background:#f2f2f2;transform:scale(1.03);}
.correct{background:#1db954 !important;color:white;}
.wrong{background:#e63946 !important;color:white;}

button{
    margin-top:25px;
    padding:14px 25px;
    border:none;
    border-radius:12px;
    background:black;
    color:white;
    font-weight:600;
    cursor:pointer;
}

/* CERTIFICATE */

.certificate{
    position:relative;
    padding:60px 40px;
    border:10px solid black;
    border-radius:25px;
    overflow:hidden;
}

.certificate::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:url("https://upload.wikimedia.org/wikipedia/commons/thumb/8/8b/Coat_of_arms_of_Germany.svg/800px-Coat_of_arms_of_Germany.svg.png");
    background-repeat:no-repeat;
    background-position:center;
    background-size:320px;
    opacity:0.06;
    pointer-events:none;
}

.gold{border-color:gold;box-shadow:0 0 50px gold;}
.silver{border-color:silver;box-shadow:0 0 50px silver;}
.bronze{border-color:#cd7f32;box-shadow:0 0 50px #cd7f32;}
.distinction{border-color:black;}

.cert-title{font-size:36px;font-weight:800;margin-bottom:10px;}
.cert-name{font-size:30px;font-weight:700;margin:20px 0;}
.rank-text{font-size:22px;margin-top:15px;font-weight:700;}

.signature{
    margin-top:50px;
    display:flex;
    justify-content:space-between;
}
.signature div{
    border-top:1px solid #000;
    width:220px;
    padding-top:5px;
}

/* PRINT SETTINGS */
@page {
    size: landscape;
    margin: 0;
}

@media print {
    body * {
        visibility: hidden;
    }
    .certificate, .certificate * {
        visibility: visible;
    }
    .certificate {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        box-shadow: none !important;
    }
    button {
        display: none !important;
    }
}

@media(max-width:768px){
    .container{padding:30px 20px;}
}
</style>
</head>

<body>

<div class="container" id="mainContent">
<h1 id="welcome"></h1>
<div class="progress-bar"><div class="progress" id="progress"></div></div>
<div class="question" id="question"></div>
<div id="options"></div>
<button id="nextBtn" onclick="nextQuestion()" style="display:none;">Next</button>
</div>

<script src="questions.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
const username = localStorage.getItem("quizUsername") || "Student";
document.getElementById("welcome").innerText="Welcome, "+username;

/* LOCK AFTER COMPLETION */
if(localStorage.getItem("quizCompleted")==="true"){
    alert("You have already completed this quiz.");
    window.location.href="leaderboard.html";
}

/* TIMER LOCK */
let startTime;
if(localStorage.getItem("quizStartTime")){
    startTime=parseInt(localStorage.getItem("quizStartTime"));
}else{
    startTime=Date.now();
    localStorage.setItem("quizStartTime",startTime);
}

let current=0;
let score=0;
let quizQuestions=questions.sort(()=>0.5-Math.random()).slice(0,10);

function updateProgress(){
    document.getElementById("progress").style.width=
    (current/quizQuestions.length)*100+"%";
}

function loadQuestion(){
    updateProgress();
    const q=quizQuestions[current];
    document.getElementById("question").innerText=`Question ${current+1}: ${q.q}`;
    const optionsDiv=document.getElementById("options");
    optionsDiv.innerHTML="";
    q.options.forEach((opt,i)=>{
        const div=document.createElement("div");
        div.classList.add("option");
        div.innerText=opt;
        div.onclick=()=>checkAnswer(div,i);
        optionsDiv.appendChild(div);
    });
}

function checkAnswer(selected,index){
    const q=quizQuestions[current];
    const options=document.querySelectorAll(".option");
    options.forEach(o=>o.onclick=null);
    if(index===q.answer){selected.classList.add("correct");score++;}
    else{selected.classList.add("wrong");options[q.answer].classList.add("correct");}
    document.getElementById("nextBtn").style.display="inline-block";
}

function nextQuestion(){
    current++;
    if(current<quizQuestions.length) loadQuestion();
    else finishQuiz();
}

async function finishQuiz(){
    localStorage.setItem("quizCompleted","true");

    const totalTime=Math.floor((Date.now()-startTime)/1000);
    const minutes=Math.floor(totalTime/60);
    const seconds=totalTime%60;

    await saveToFirebase(score,totalTime);
    const leaderboard=await getLeaderboard();
    const rank=leaderboard.findIndex(e=>e.username===username)+1;

    let certClass="distinction";
    if(rank===1) certClass="gold";
    if(rank===2) certClass="silver";
    if(rank===3) certClass="bronze";

    document.getElementById("mainContent").innerHTML=`
        <div class="certificate ${certClass}">
            <div class="cert-title">Certificate of Academic Achievement</div>
            <p>This certifies that</p>
            <div class="cert-name">${username}</div>
            <p>has successfully completed the German Unification Academic Quiz</p>
            <p><strong>Score:</strong> ${score}/${quizQuestions.length}</p>
            <p><strong>Time Taken:</strong> ${minutes}m ${seconds}s</p>
            <div class="rank-text">Rank Achieved: ${rank}</div>
            <div class="signature">
                <div>Quiz Authority</div>
                <div>${new Date().toLocaleDateString()}</div>
            </div>
        </div>
        <button onclick="printCertificate()">Print Certificate</button>
        <button onclick="window.location.href='leaderboard.html'">Leaderboard</button>
    `;

    megaConfetti();
}

function printCertificate(){
    window.print();
}

function megaConfetti(){
    const duration=5000;
    const end=Date.now()+duration;
    const colors=["#000","#dd0000","#ffce00"];
    (function frame(){
        confetti({particleCount:10,spread:80,origin:{x:0},colors});
        confetti({particleCount:10,spread:80,origin:{x:1},colors});
        if(Date.now()<end){requestAnimationFrame(frame);}
    })();
    confetti({particleCount:300,spread:150,origin:{y:0.6},colors});
}

loadQuestion();
</script>

<!-- FIREBASE (unchanged) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCwDkm3VB3dh1kkZYGw10bGV7DBo9yNjGU",
  authDomain: "german-unification-quiz.firebaseapp.com",
  projectId: "german-unification-quiz",
  storageBucket: "german-unification-quiz.appspot.com",
  messagingSenderId: "748292475340",
  appId: "1:748292475340:web:3352e9a590862c20ef7569"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.saveToFirebase=async function(score,totalTime){
    const snapshot=await getDocs(collection(db,"leaderboard"));
    let exists=false;
    snapshot.forEach(doc=>{
        if(doc.data().username===localStorage.getItem("quizUsername")){
            exists=true;
        }
    });
    if(!exists){
        await addDoc(collection(db,"leaderboard"),{
            username:localStorage.getItem("quizUsername"),
            score:score,
            time:totalTime,
            timestamp:new Date()
        });
    }
};

window.getLeaderboard=async function(){
    const snapshot=await getDocs(collection(db,"leaderboard"));
    let arr=[];
    snapshot.forEach(doc=>arr.push(doc.data()));
    arr.sort((a,b)=>b.score-a.score||a.time-b.time);
    return arr;
};
</script>

</body>
</html>
